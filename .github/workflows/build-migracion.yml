name: Validar migración IA económica

on:
  push:
    branches:
      - migracion-ia-economica
  pull_request:
    branches:
      - migracion-ia-economica

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build
