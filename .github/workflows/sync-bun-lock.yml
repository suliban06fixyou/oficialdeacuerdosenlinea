name: Sync Bun lockfile

on:
  push:
    branches:
      - migracion-ia-economica
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-ia-economica
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Regenerate lockfile
        run: bun install --no-frozen-lockfile

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "ci: sync bun lockfile"
          git push origin HEAD:migracion-ia-economica
